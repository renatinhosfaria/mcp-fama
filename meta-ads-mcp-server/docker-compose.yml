version: "3.8"

services:
  mcp-facebook-ads:
    image: mcp-facebook-ads:latest
    networks:
      - network_public
    environment:
      - API_KEY=${API_KEY:?API_KEY required}
      - PORT=${PORT:-3200}
      - RATE_LIMIT_RPM=${RATE_LIMIT_RPM:-60}
      - MCP_SESSION_IDLE_TTL_MS=${MCP_SESSION_IDLE_TTL_MS:-1800000}
      - MCP_MAX_SESSIONS=${MCP_MAX_SESSIONS:-250}
      - MCP_SESSION_ALERT_THRESHOLD=${MCP_SESSION_ALERT_THRESHOLD:-150}
      - MCP_HEAP_ALERT_BYTES=${MCP_HEAP_ALERT_BYTES:-314572800}
      - HTTP_KEEP_ALIVE_TIMEOUT_MS=${HTTP_KEEP_ALIVE_TIMEOUT_MS:-95000}
      - HTTP_HEADERS_TIMEOUT_MS=${HTTP_HEADERS_TIMEOUT_MS:-100000}
      - SHUTDOWN_GRACE_MS=${SHUTDOWN_GRACE_MS:-10000}
      - NODE_ENV=production
      - META_ACCESS_TOKEN=${META_ACCESS_TOKEN:?META_ACCESS_TOKEN required}
      - META_AD_ACCOUNT_ID=act_24036721645944375
      - META_API_VERSION=v25.0
      - META_BUSINESS_ID=1190286072868410
    stop_grace_period: 20s
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3200/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 3
        window: 120s
      labels:
        - traefik.enable=true
        - traefik.docker.network=network_public
        - "traefik.http.routers.mcp_facebook_ads.rule=Host(`mcp-facebook-ads.famachat.com.br`)"
        - traefik.http.routers.mcp_facebook_ads.entrypoints=websecure
        - traefik.http.routers.mcp_facebook_ads.tls=true
        - traefik.http.routers.mcp_facebook_ads.tls.certresolver=letsencryptresolver
        - traefik.http.services.mcp_facebook_ads.loadbalancer.server.port=3200

networks:
  network_public:
    external: true
