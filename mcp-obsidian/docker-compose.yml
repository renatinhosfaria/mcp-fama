version: "3.8"

services:
  mcp-obsidian:
    image: mcp-obsidian:latest
    networks:
      - network_public
    environment:
      - PORT=3201
      - VAULT_PATH=/vault
      - RATE_LIMIT_RPM=300
      - NODE_ENV=production
      # Phase 3 cutover: sync worker active. Cron host runs 1x/day as safety-net only.
      - SYNC_ENABLED=true
      - SYNC_INTERVAL_MS=30000
      - GIT_REMOTE=origin
      - GIT_BRANCH=main
      - GIT_AUTHOR_NAME=mcp-obsidian
      - GIT_AUTHOR_EMAIL=mcp@fama.local
      - SEMANTIC_ENABLED=${SEMANTIC_ENABLED:-false}
      - SEMANTIC_DATABASE_URL=${SEMANTIC_DATABASE_URL:-postgresql://mcp_obsidian:replace-me@semantic-postgres:5432/mcp_obsidian}
      - SEMANTIC_EMBEDDING_MODEL=${SEMANTIC_EMBEDDING_MODEL:-text-embedding-3-large}
      - SEMANTIC_EMBEDDING_DIMENSIONS=${SEMANTIC_EMBEDDING_DIMENSIONS:-1536}
      - SEMANTIC_MIN_SCORE=${SEMANTIC_MIN_SCORE:-0.75}
      - SEMANTIC_MAX_RESULTS=${SEMANTIC_MAX_RESULTS:-5}
      - SEMANTIC_PREVIEW_CHARS=${SEMANTIC_PREVIEW_CHARS:-600}
    volumes:
      - /root/fama-brain:/vault:rw
      - /root/mcp-fama/mcp-obsidian/.env:/app/.env:ro
      - /var/log/mcp-obsidian:/app/logs
      - /root/.ssh/fama-brain-deploy:/root/.ssh/id_ed25519:ro
      - /root/.ssh/fama-brain-deploy.pub:/root/.ssh/id_ed25519.pub:ro
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3201/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: "1"
          memory: 512M
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 3
        window: 120s
      labels:
        - traefik.enable=true
        - traefik.docker.network=network_public
        - "traefik.http.routers.mcp_obsidian.rule=Host(`mcp-obsidian.famachat.com.br`)"
        - traefik.http.routers.mcp_obsidian.entrypoints=websecure
        - traefik.http.routers.mcp_obsidian.tls=true
        - traefik.http.routers.mcp_obsidian.tls.certresolver=letsencryptresolver
        - traefik.http.services.mcp_obsidian.loadbalancer.server.port=3201

  semantic-postgres:
    image: pgvector/pgvector:pg16
    networks:
      - network_public
    environment:
      - POSTGRES_DB=mcp_obsidian
      - POSTGRES_USER=mcp_obsidian
      - POSTGRES_PASSWORD=${SEMANTIC_POSTGRES_PASSWORD:-replace-me}
    volumes:
      - semantic_postgres_data:/var/lib/postgresql/data
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager

networks:
  network_public:
    external: true

volumes:
  semantic_postgres_data:
